<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel del barbero | Tarjeta de sellos</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070d17">
<link rel="icon" href="favicon-panel.svg" type="image/svg+xml">
<link rel="alternate icon" href="img/favicon-panel-32.png" type="image/png">
<link rel="apple-touch-icon" href="img/apple-touch-icon-panel.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Tarjeta de sellos">
<meta property="og:title" content="Panel del barbero">
<meta property="og:description" content="Da sellos con un toque, escanea el QR de tus clientes y mira tu clientela en vivo.">
<meta property="og:url" content="https://kromdigital.github.io/sellos-barberia/panel.html">
<meta property="og:image" content="https://kromdigital.github.io/sellos-barberia/img/og-panel.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://kromdigital.github.io/sellos-barberia/img/og-panel.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="panel">
<header class="top">
  <a href="panel.html" class="brand" id="brandName">Tu Barbería</a>
  <span class="tag">Panel</span>
</header>
<div class="pole" aria-hidden="true"></div>

<main>
  <section id="panel" class="view" hidden>
    <div id="pinBox">
      <h1>Panel del barbero</h1>
      <form id="pinForm" class="stack">
        <label>Correo
          <input id="email" type="email" autocomplete="username" required>
        </label>
        <label>Contraseña
          <input id="pass" type="password" autocomplete="current-password" required>
        </label>
        <button class="btn red" type="submit">Entrar</button>
        <p id="pinMsg" class="msg" role="status"></p>
      </form>
    </div>

    <div id="adminBox" hidden>
      <h1>Panel</h1>
      <div id="stats" class="stats"></div>
      <button id="scanBtn" class="btn red wide" type="button">Escanear QR</button>
      <div id="reader" hidden></div>
      <p id="panelMsg" class="msg" role="status"></p>

      <h2>Tu enlace para clientes</h2>
      <input id="shareLink" readonly aria-label="Enlace para tus clientes">

      <h2>Tu enlace del panel</h2>
      <input id="panelLink" readonly aria-label="Enlace del panel del barbero">

      <h2>Clientes</h2>
      <input id="search" type="search" placeholder="Buscar por nombre o celular">
      <ul id="clientList" class="clients"></ul>

      <h2>Agregar cliente</h2>
      <form id="addForm" class="stack">
        <input id="newName" type="text" maxlength="40" placeholder="Nombre" required>
        <input id="newPhone" type="tel" inputmode="numeric" maxlength="14" placeholder="Celular (10 dígitos)" required>
        <button class="btn" type="submit">Agregar</button>
        <p id="addMsg" class="msg" role="status"></p>
      </form>

      <h2>Configuración</h2>
      <form id="cfgForm" class="stack">
        <label>Nombre de la barbería <input id="shop" type="text" maxlength="40"></label>
        <label>Sellos para el premio <input id="goal" type="number" min="3" max="20"></label>
        <label>Premio <input id="reward" type="text" maxlength="40"></label>
        <label>Promoción del momento <input id="promoIn" type="text" maxlength="80"></label>
        <label>WhatsApp (con lada del país) <input id="waIn" type="tel" maxlength="20" placeholder="+52 1 33 1234 5678"></label>
        <label>Dirección <input id="addrIn" type="text" maxlength="80"></label>
        <label>Instagram <input id="igIn" type="text" maxlength="40" placeholder="@tubarberia"></label>
        <label>Hora de apertura <input id="openH" type="number" min="0" max="23"></label>
        <label>Hora de cierre <input id="closeH" type="number" min="1" max="24"></label>
        <label class="check"><input id="sundayIn" type="checkbox"> Abrimos los domingos</label>
        <label>Servicios (uno por línea: nombre | precio | descripción)
          <textarea id="svcIn" rows="5" maxlength="900"></textarea>
        </label>
        <button class="btn" type="submit">Guardar cambios</button>
        <p id="cfgMsg" class="msg" role="status"></p>
      </form>
      <button id="logoutAdmin" class="btn ghost" type="button">Cerrar sesión</button>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
